name: Build and Release APK
on:
  push:
    branches: [ rewrite ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove leftover submodule refs
        run: |
          rm -rf .git/modules 2>/dev/null || true
          git submodule deinit -f . 2>/dev/null || true

      - name: Create API_KEYS
        run: |
          cat > API_KEYS << 'EOF'
          APP_ID = ${{ secrets.APP_ID || 6 }}
          APP_HASH = "${{ secrets.APP_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}"
          MAPS_V2_API = ${{ secrets.MAPS_KEY }}
          SIGNING_KEY_PASSWORD = ${{ secrets.CERT_KEY || 'android' }}
          SIGNING_KEY_ALIAS = ${{ secrets.CERT_KEY || 'android' }}
          SIGNING_KEY_STORE_PASSWORD = ${{ secrets.CERT_KEY || 'android' }}
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: gradle-builds

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v2

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install bison gcc make curl ninja-build ccache -y

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleAfatRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-APK
          path: |
            TMessagesProj/build/outputs/apk/afat/release/*.apk

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: AyuGram ${{ github.event.inputs.version }}
          body_file: CHANGELOG.md
          files: |
            TMessagesProj/build/outputs/apk/afat/release/*.apk
          draft: false
          prerelease: false
